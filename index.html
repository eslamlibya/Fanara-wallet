<title>Fanara Wallet</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--pri:#3a5ff0;--pri2:#1b2566;--gold:#e8a33d;--bg:#f4f5f8;--card:#fff;--txt:#161b3a;--mut:#6c7392;--line:#e6e8f0;--tint:rgba(58,95,240,.1);--red:#d94c4c;--grn:#2a9d62;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1120;--card:#171d33;--txt:#e8ecf8;--mut:#8f98ba;--line:#242b47;--tint:rgba(110,140,255,.16)}}
:root[data-theme="dark"]{--bg:#0d1120;--card:#171d33;--txt:#e8ecf8;--mut:#8f98ba;--line:#242b47;--tint:rgba(110,140,255,.16)}
*{box-sizing:border-box;margin:0;font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt)}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
svg{display:block}
.demo{background:var(--gold);color:#3a2600;text-align:center;font-size:12px;padding:4px;font-weight:700}
.hd{background:linear-gradient(180deg,var(--pri),var(--pri2));color:#fff;padding:20px 18px 22px;text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;direction:ltr}
.brand .lg{width:38px;height:38px}.brand b{font-size:21px;font-weight:800;letter-spacing:.3px}
.hd h1{font-size:20px;font-weight:700}.hd small{opacity:.8;font-size:13px}
.pills{display:flex;gap:8px;justify-content:center;margin-top:16px}.pills span{padding:8px 18px;border-radius:20px;font-size:14px;font-weight:500}.pills .on{background:#fff;color:var(--pri2);font-weight:700}
main{flex:1;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(20,30,80,.06)}
.row{display:flex;justify-content:space-between;align-items:center}
.ban{background:linear-gradient(135deg,#5b7cf5,#2a3a9c);color:#fff;border-radius:24px;padding:22px;margin-bottom:14px}.ban b{font-size:20px;display:block;margin:4px 0}.ban small{opacity:.85}
.acc{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin-bottom:8px;scrollbar-width:none}
.acc .card{min-width:100%;scroll-snap-align:center;background:linear-gradient(135deg,#3a5ff0,#1b2566);color:#fff;position:relative;overflow:hidden}
.acc .card:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07);left:-50px;bottom:-70px}
.bal{font-size:32px;font-weight:800;margin:12px 0}.bal span{font-size:15px;font-weight:500;opacity:.8}
.eye{background:none;border:0;color:#fff;cursor:pointer;padding:0}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:14px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--pri);width:20px;border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;text-align:center;font-size:12px;font-weight:500}.grid>div{cursor:pointer}
.ic{width:52px;height:52px;border-radius:17px;background:var(--tint);color:var(--pri);display:flex;align-items:center;justify-content:center;margin:0 auto 7px}
.ic.sm{width:42px;height:42px;border-radius:14px;margin:0;flex:none}
.ic.r{background:rgba(217,76,76,.1);color:var(--red)}.ic.g{background:rgba(42,157,98,.12);color:var(--grn)}
h3{font-size:16px;font-weight:700;margin-bottom:12px}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}
.tx b{display:block;font-size:14px;font-weight:500}.tx small{color:var(--mut);font-size:12px}.tx .am{margin-inline-start:auto;font-weight:700;direction:ltr;font-size:14px}
.out{color:var(--red)}.in{color:var(--grn)}
.li{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;color:var(--txt)}.li:last-child{border:0}
.li .lr{display:flex;gap:12px;align-items:center}.li small{display:block;color:var(--mut);font-size:12px}.li b{font-weight:500;font-size:15px}.li>svg{color:var(--mut)}
input{width:100%;padding:15px;border:1.5px solid var(--line);border-radius:16px;font-size:16px;background:var(--card);color:var(--txt);margin-bottom:12px}
.btn{width:100%;padding:15px;border:0;border-radius:16px;background:linear-gradient(180deg,var(--pri),var(--pri2));color:#fff;font-size:17px;font-weight:700;cursor:pointer}
.btn.o{background:none;border:1.5px solid var(--pri);color:var(--pri);margin-top:10px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--card);display:flex;border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--mut);cursor:pointer}nav .on{color:var(--pri);font-weight:700}
.login{padding:34px 22px;text-align:center;flex:1;color:#fff;background:linear-gradient(180deg,var(--pri),var(--pri2) 320px,var(--bg) 320px)}
.login .brand{flex-direction:column;gap:8px;margin-bottom:6px}.login .brand .lg{width:84px;height:84px}.login .brand b{font-size:28px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#161b3a;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;max-width:90%;text-align:center}
.hrow{display:flex;align-items:center;justify-content:space-between}.bk{background:none;border:0;color:#fff;padding:0;cursor:pointer}
.hd small{display:block;margin-top:6px;font-size:14px}
.pills{display:flex;gap:8px;justify-content:center;margin-top:16px}.pill{border:0;background:none;color:#fff;font:inherit;padding:8px 18px;border-radius:20px;font-size:15px;cursor:pointer}.pill.on{background:#fff;color:var(--pri2);font-weight:700}
.sv{background:none;border:0;font:inherit;color:var(--txt);font-size:13px;font-weight:500;cursor:pointer;padding:0}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:13px;color:var(--mut);background:none;border:0;cursor:pointer}nav button.on{color:var(--pri);font-weight:700}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pt{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px;text-align:center;font:inherit;color:var(--txt);cursor:pointer}.pt img{width:64px;height:64px;border-radius:16px;object-fit:cover;margin-bottom:8px}.pt b{display:block;font-size:15px}.pt small{color:var(--mut);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chip{padding:10px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-size:15px;cursor:pointer}.chip.on{border-color:var(--pri);background:var(--tint);color:var(--pri);font-weight:700}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;gap:12px}.kv:last-child{border:0}.kv span{color:var(--mut)}.kv b{font-weight:500;text-align:left}
.err{color:var(--red);font-size:14px;margin:-6px 0 10px}
.ov{position:fixed;inset:0;background:rgba(10,14,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}.sheet{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
select{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:16px;font:inherit;font-size:16px;background:var(--card);color:var(--txt);margin-bottom:12px}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:6px}
.dc{background:linear-gradient(135deg,#1b2566,#3a5ff0);color:#fff;border-radius:22px;padding:22px;margin-bottom:14px;direction:ltr;text-align:left}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;border-radius:5px}
.demo{font-size:13px}
</style>
</head>
